schema_version: "1.0"

extension:
  id: "spectra"
  name: "Spectra"
  version: "1.26.0"
  description: "TELUS Digital - Agentic software engineering across the entire SDLC."
  category: "workflow"
  effect: "read-write"
  author: "TELUS Digital"
  repository: "https://github.com/telus-digital/spectra"
  license: "Apache-2.0"
  homepage: "https://github.com/telus-digital/spectra/tree/main/spectra"

requires:
  # Bump this to the spec-kit version you actually test against.
  speckit_version: ">=0.11.0"
  tools:
    # Used by speckit.spectra.create-pr and speckit.spectra.review-pr at runtime. Kept optional at the
    # extension level because adr, brd, and domain-analyzer never touch GitHub — marking gh required
    # would block installation for users who only want those. Both GitHub commands hard-gate on gh at
    # run time: a missing binary or a failed `gh auth status` stops them before any other work, with
    # distinct remedies (install vs `gh auth login`). What each does *after* that gate differs —
    # create-pr hands over the manual git/gh commands and states whether the branch was pushed, while
    # review-pr hands over the rendered review body for manual posting.
    - name: git
      required: false
    - name: gh
      required: false

provides:
  commands:
    - name: "speckit.spectra.adr"
      file: "commands/adr.md"
      description: "Create a new Architecture Decision Record from a short description, grounded in the codebase and constitution, and hand any constitution change to /speckit-constitution."
    - name: "speckit.spectra.domain-analyzer"
      file: "commands/domain-analyzer.md"
      description: "Say whether the project has a constitution, infer its domain, work six lenses — handing workflow to speckit.spectra.methodology — and ask the SME seven questions to decide each lens's guardrails in the session — at least four options per question, one recommended, one Skip — then write the decisions and a Constitution input section to <artifact-root>/DOMAIN_ANALYSIS.md and hand it to /speckit-constitution to create or update the constitution. Reads documents imported by kb-vault as claimed, never as current practice, and replaces a DOMAIN_ANALYSIS.md it did not write only with consent."
    - name: "speckit.spectra.methodology"
      file: "commands/methodology.md"
      description: "Say whether the project is brownfield or greenfield and whether the constitution will be created or updated, then work nine lenses — methodology stack, work modes, requirements intake, spec lifecycle, branching, review gates, change records, AI collaboration, governance — and ask the team ten questions one at a time, each with at least four options, one recommended, one Skip. Spec-driven development is the fixed base; test-first, behaviour-first, domain-first, contract-first, and ADR-driven overlays enter only as obligations bound to a spec-kit phase. Then write an onboarding-grade methodology with a Constitution input section to <artifact-root>/ENGINEERING_METHODOLOGY.md and hand it to /speckit-constitution to create or update the constitution. Reads documents imported by kb-vault as claimed, never as current practice."
    - name: "speckit.spectra.create-pr"
      file: "commands/create-pr.md"
      description: "Open a correctly-targeted GitHub PR for the current branch — optionally linked to an issue via --issue — with the body built from the overridable pr-template, one final confirmation before anything is created, and the PR URL returned."
    - name: "speckit.spectra.brd"
      file: "commands/brd.md"
      description: "Transform a raw business requirement (inline text or a .docx/.pdf/.md/.txt document) into a structured, specify-ready BRD under docs/brd/ (or the project's declared artifact root), asking clarifying questions when needed, then hand off to the specify command."
    - name: "speckit.spectra.review-pr"
      file: "commands/review-pr.md"
      description: "Review a GitHub pull request against its spec, its linked issue (optional, via --issue), the ADRs, and the constitution, then publish one human-curated review — an overridable summary body plus line-anchored comments with applicable code suggestions — proposing blockers and majors by default so a one-word yes publishes only what should block the merge. From a test, deployment, or domain strategy and the engineering methodology, only accepted guardrails are standards."
    - name: "speckit.spectra.flaky-test-detector"
      file: "commands/flaky-test-detector.md"
      description: "Find the tests that pass and fail on the same code by reading the test source alone — no test run, no CI history — report each with a confidence rating and a concrete fix, then, behind two explicit gates, write a resumable task list to .specify/memory/flaky-test-analysis.md and apply the fixes the developer approves."
    - name: "speckit.spectra.test-strategy"
      file: "commands/test-strategy.md"
      description: "Read the project, classify it greenfield or brownfield from its own evidence, ask five judgment calls the repository cannot settle — where the testing weight should sit, whether an external consumer exists, which journeys justify end-to-end or UAT and who signs UAT off, what has broken before, and what the organisation forbids (including whether an AI agent may execute UAT) — one question at a time, each carrying a recommendation and the evidence behind it, then write one testing strategy to docs/TEST_STRATEGY.md (or TEST_STRATEGY.md at the project's declared artifact root) covering six lenses — unit, integration, API contract, end-to-end, UAT, and regression — recorded in front matter that every test plan inherits, plus a coverage floor the project can actually hold — in brownfield never above the measured baseline, whatever any answer requests. It never asks what it can measure: the mode, the stack, the surfaces, and the coverage figure are read, not requested, and an answer is recorded as stated rather than as evidence. Declining every question produces the document it would have written on its own, and --non-interactive skips the round outright. A foundation-phase agent, run once alongside the constitution. It then drafts the guardrails that would bake the strategy into every work session — including, where UAT applies, the rule that the implement command never executes or ticks UAT tasks — records the team's decision on each under a frozen ts- ID, and hands a Constitution input section to speckit.constitution to create the constitution or update it: it never writes the constitution itself, in any run, approved or not. Reads documents imported by kb-vault as claimed and the accepted guardrails of its sibling documents, so no clause gets two sources. Recommends configuration rather than applying it, runs nothing without an explicit confirmation, and makes no network request."
    - name: "speckit.spectra.deployment-strategy"
      file: "commands/deployment-strategy.md"
      description: "Read the project and any local documents the user references, classify what it ships — service, static site, library, CLI or desktop tool, mobile app, or infrastructure — and write one deployment strategy to docs/DEPLOYMENT_STRATEGY.md (or DEPLOYMENT_STRATEGY.md at the project's declared artifact root) covering six lenses: environments and promotion, pipeline and artifact traceability, release and versioning, data and schema change, rollback and recovery, and operability and configuration. Each lens reports today's state before recommending, and every claim is marked verified, claimed, stated, or convention. Asks five judgment calls the repository cannot settle — hosting, production approval, a pre-release environment, recovery targets, release cadence — once per project and one at a time, each with a recommendation and the evidence behind it; never invents a value only the client or ops owner can supply, listing it as an open question instead. Operability stays at the level of policy and ownership. Then drafts only durable invariants as guardrails, records the team's decision on each under a frozen ds- ID, and hands a Constitution input section to speckit.constitution with a ready-to-paste line, to create the constitution or update it: it never edits the constitution, in any run, approved or not. Never edits source, CI, manifests, or infrastructure code, runs nothing, and makes no network request."
    - name: "speckit.spectra.impact"
      file: "commands/impact.md"
      description: "Produce a codebase-grounded feature impact analysis for a stakeholder go / no-go decision before any specification work begins — cited findings, a defined impact rating, at most five clarifying questions, and a stated coverage boundary — written under docs/impact-analysis/ (or the project's declared artifact root). Makes no network request and accepts no repository URL: other systems are declared as text, a document, or a local directory read in place."
    - name: "speckit.spectra.test-plan"
      file: "commands/test-plan.md"
      description: "Turn one specification into a stakeholder-facing test plan written beside it as test-plan.md — scope, risks, traceable test conditions, suggested UAT scenarios, regression scope, environment, and exit criteria — grounded in the project's own testing policy and its existing suite. It uses exactly the lenses the test strategy chose: a lens the strategy rules out is unavailable, and it says so loudly when the strategy predates UAT and regression or does not exist. The spec path is required and never inferred: no branch name, no feature record, no most-recent-file guess, because a plan generated against the wrong spec is undetectably wrong to whoever approves it. Every acceptance criterion reaches a condition or a UAT scenario or is reported as uncovered, every user story gets a UAT scenario or a reason, and an ambiguous requirement gets a stated gap rather than an invented condition. Carries no checkbox in any section — it is approved, not tracked — and is offered by an optional hook after specify. It ends with a ready-to-paste planning prompt that writes the plan's testing obligations into plan.md, so the tasks include the tests and a final UAT phase the implement command does not execute. Writes one file, runs nothing, and makes no network request."
    - name: "speckit.spectra.uat"
      file: "commands/uat.md"
      description: "Run user-acceptance testing for one feature, only on explicit request: read the UAT phase in its tasks.md and the Suggested UAT scenarios in its test-plan.md, start the build after your confirmation, perform the scenarios the agent can actually drive, save screenshots or transcripts as evidence beside the spec, tick only the UAT tasks it observed pass, and write uat-report.md. The feature path is required and never inferred. Human-only, failed, and blocked scenarios stay open with a reason. Never edits source, tests, CI, the spec, the test plan, or the constitution, never reproduces a secret, and makes no network request beyond what the build under test makes."

  # The section structure of every document Spectra produces. Both are resolved through Spec Kit's template
  # stack, so a project overrides one by dropping its own copy at .specify/templates/overrides/<name>.md —
  # committed, team-wide, and outside the extension tree, so an extension update cannot discard it. Editing
  # the installed copy under .specify/extensions/ is NOT the customization path: extension files are
  # replaced wholesale on update.
    - name: "speckit.spectra.defect-rca"
      file: "commands/defect-rca.md"
      description: "Guide a hypothesis-driven root cause analysis of a defect from a JIRA ticket, a GitHub issue URL, or a plain description — gathering evidence from the code, surfacing any prior analysis of the same defect, and writing one advisory analysis under the project's artifact root."
    - name: "speckit.spectra.kb-vault"
      file: "commands/kb-vault.md"
      description: "Absorb documents the user supplies — PDFs, Word files, images, or dictated knowledge — classify them, and land them as Markdown under the project's artifact root, planned and approved before anything is written. Updates an existing document rather than duplicating it, and never commits. A domain analysis, engineering methodology, test strategy, or deployment strategy is kept as a policy source in its own <kind>-source folder and referred to the agent that owns it — kb-vault never writes the documents those agents feed the constitution."

  templates:
    - name: "adr-template"
      file: "templates/adr-template.md"
      description: "Section structure for Architecture Decision Records produced by speckit.spectra.adr. Override at .specify/templates/overrides/adr-template.md."
    - name: "brd-template"
      file: "templates/brd-template.md"
      description: "Canonical Business Requirements Document structure produced by speckit.spectra.brd. Override at .specify/templates/overrides/brd-template.md."
    - name: "pr-template"
      file: "templates/pr-template.md"
      description: "Pull request body structure used by speckit.spectra.create-pr. Override at .specify/templates/overrides/pr-template.md."
    - name: "review-template"
      file: "templates/review-template.md"
      description: "Findings presentation for speckit.spectra.review-pr — the summary body and the inline comment. Override at .specify/templates/overrides/review-template.md. The revision anchor, the AI-assisted disclosure, and the coverage statement stay with the command."
    - name: "impact-analysis-template"
      file: "templates/impact-analysis-template.md"
      description: "Section structure for the feature impact analyses produced by speckit.spectra.impact. Override at .specify/templates/overrides/impact-analysis-template.md. The citation rule, the confidence levels, the impact-rating triggers, the coverage statement, and the prohibition on reproducing a secret stay with the command."
    - name: "domain-analysis-template"
      file: "templates/domain-analysis-template.md"
      description: "Section structure for the domain analysis produced by speckit.spectra.domain-analyzer. Override at .specify/templates/overrides/domain-analysis-template.md. The front matter, the candidate record and its key order, the file-path evidence rule, the observed/aspirational basis, the Constitution input format, frozen IDs, and the re-run preservation of SME decisions stay with the command."
    - name: "engineering-methodology-template"
      file: "templates/engineering-methodology-template.md"
      description: "Section structure for the engineering methodology produced by speckit.spectra.methodology. Override at .specify/templates/overrides/engineering-methodology-template.md. The front matter, the candidate record and its key order, cited current practice, the observed/aspirational basis, the obligations matrix as the closed set of phase obligations, the Constitution input format, frozen IDs, and the re-run preservation of team decisions stay with the command."
    - name: "test-strategy-template"
      file: "templates/test-strategy-template.md"
      description: "Section structure for the testing strategy produced by speckit.spectra.test-strategy. Override at .specify/templates/overrides/test-strategy-template.md. The evidence-or-convention marker, the six mandatory lenses and their front-matter record, the floor-never-exceeds-baseline rule, the baseline provenance labels, the tool tiers, and the coverage statement stay with the command."
    - name: "test-plan-template"
      file: "templates/test-plan-template.md"
      description: "Section structure for the per-feature test plans produced by speckit.spectra.test-plan. Override at .specify/templates/overrides/test-plan-template.md. The traceability invariant, the strategy-consistent lens set, the every-story-gets-a-UAT-scenario rule, the no-checkbox rule, the cited-absence rule, the priority derivation, the secret prohibition, and the coverage statement stay with the command."
    - name: "uat-report-template"
      file: "templates/uat-report-template.md"
      description: "Section structure for the per-feature UAT report produced by speckit.spectra.uat. Override at .specify/templates/overrides/uat-report-template.md. The observed-pass-only rule, evidence linking, the open-with-a-reason rule for human-only, failed, and blocked scenarios, the prohibition on reproducing a secret, and the coverage statement stay with the command."
    - name: "deployment-strategy-template"
      file: "templates/deployment-strategy-template.md"
      description: "Section structure for the deployment strategy produced by speckit.spectra.deployment-strategy. Override at .specify/templates/overrides/deployment-strategy-template.md. The four provenances (verified, claimed, stated, convention), the never-invent rule for open questions, the policy-level boundary on operability, the prohibition on reproducing a secret, and the rule that the promotion diagram shows only what the environments table states stay with the command."

    - name: "defect-rca-template"
      file: "templates/defect-rca-template.md"
      description: "Section structure for the root cause analyses produced by speckit.spectra.defect-rca. Override at .specify/templates/overrides/defect-rca-template.md. The symptom/root-cause distinction, answer-first ordering, the recording of invalidated hypotheses, evidence-source attribution, the advisory status line, the related-prior-RCA field, and the prohibition on reproducing a secret stay with the command."
    - name: "kb-document-template"
      file: "templates/kb-document-template.md"
      description: "Default shape for a knowledge document ingested by speckit.spectra.kb-vault, used where no category-specific template resolves. Override at .specify/templates/overrides/kb-document-template.md, or shape one category with .specify/templates/overrides/<category>-template.md. The traceability rule, the gap-not-invention rule, provenance, and the prohibition on reproducing a secret stay with the command."

hooks:
  # Every Spectra hook is an offer: optional, so it asks and never runs on its own.
  after_specify:
    command: speckit.spectra.test-plan
    optional: true
    prompt: "Generate a test plan for this spec? Pass the spec file path this specify run just wrote (its SPEC_FILE) as the argument."
    description: "Offer a stakeholder test plan right after the specification is written"
  # A list, so UAT is offered before a pull request: listed first and given the lower priority number,
  # which Spec Kit sorts on (per-event lists with priority arrived in Spec Kit 0.10.0).
  after_implement:
    - command: speckit.spectra.uat
      optional: true
      priority: 5
      prompt: "Run UAT now? The agent performs the scenarios it can drive and leaves the rest for a human."
      description: "Offer agent-run UAT after implementation, before a PR is opened"
    - command: speckit.spectra.create-pr
      optional: true
      priority: 10
      prompt: "Open a pull request for this spec?"
      description: "Offer to open a PR after implementation completes"

