name: CI

on:
  pull_request:
    branches: [main]
  push:
    # `ci` is the staging branch: tools/ship.py pushes a commit there to earn its check runs, then
    # pushes the same SHA to main, which the ruleset accepts only because those checks exist and are
    # green. Check runs attach to a SHA, not a branch, which is what makes that work. See SHIPPING.md.
    branches: [main, ci]

# Every action is pinned to a commit, with its version in a trailing comment: a tag can be moved to
# different code, a commit cannot. Updating one means resolving the new tag to its commit by hand.
#
# Read-only by default. The codeql job widens this for itself, since it uploads to the Security tab.
permissions:
  contents: read

jobs:
  tests:
    name: Tests pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          # The current stable release on the runner. Nothing ships as a Python package, so there is
          # no version floor to hold.
          python-version: '3.x'
      - name: The test suite passes
        # Standard-library `unittest`, not pytest: the zero-dependency constraint applies to the
        # whole repository, so this job installs nothing.
        run: python -m unittest discover -s tests -v

  catalog:
    name: Catalog and package stay in sync
    # Constitution Principle V: catalog.json, extension.yml and the published zip must never drift.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: The generated agent listings match agents-list.json
        # Every check below is defined once in tools/checks.py and run from two places: here, and
        # tools/ship.py's pre-flight. tests/test_ci_contract.py fails when this list and the module's
        # registry disagree, so a check cannot be registered and silently never run in CI.
        run: python3 tools/checks.py generated-listings
      - name: extension.yml, catalog.json and the zip agree
        run: python3 tools/checks.py catalog-parity
      - name: Every published copy of the description agrees
        run: python3 tools/checks.py description-parity
      - name: The published zip matches the spectra/ folder
        run: python3 tools/checks.py zip-matches

  codeql:
    name: CodeQL finds no high-severity issues
    # There are no pull requests here, so CodeQL's own PR check never runs and its findings would only
    # reach the Security tab after the commit was already on main. Running it in this workflow puts it
    # on the `ci` branch where tools/ship.py earns the gate, and the last step makes it able to fail:
    # analyze is green whatever it finds. See tools/codeql_gate.py for what blocks and what only warns.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Set up CodeQL for Python and the workflows themselves
        # `actions` scans these YAML files: script injection in a `run:` step is the likeliest real
        # vulnerability in a repository whose shipped code has no dependencies.
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: python, actions
          build-mode: none
          queries: security-and-quality
          # `import unittest` beside `from unittest import mock` is the idiom across tests/, not a
          # defect; flagging it on every new test file would only teach people to ignore warnings.
          config: |
            query-filters:
              - exclude:
                  id: py/import-and-import-from
      - name: Analyse and upload to the Security tab
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          output: codeql-results
      - name: No high or critical finding
        run: python3 tools/codeql_gate.py codeql-results
